name: Expo CI
on:
  push:
    branches: [main, feature/products]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm expo export --platform web
      - run: npm tsc --noEmit
